name: 'dbt_utils_demo'
version: '1.0.0'
config-version: 2

profile: 'dbt_utils_demo'

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  dbt_utils_demo:
    +materialized: view

seeds:
  dbt_utils_demo:
    customers:
      # dbt-core 1.x infers integer and dbt 2 infers bigint; pin it so the contracts match on both
      +column_types:
        customer_id: bigint
