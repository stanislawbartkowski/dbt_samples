name: 'dbt_utils_demo'
version: '1.0.0'
config-version: 2

profile: 'dbt_utils_demo'

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]

clean-targets:
  - "target"
  - "dbt_packages"

flags:
  # Compare the unrendered value of configs set in config() and in properties
  # YAML, so configs that depend on target.name don't look modified in CI.
  # dbt 2.0.11 always does this, so the flag has no effect; slim_ci_demo.sh
  # sets it to false and true to show that.
  state_modified_compare_more_unrendered_values: true

models:
  dbt_utils_demo:
    +materialized: view
    marts:
      # Tables in prod, views everywhere else: cheaper CI and dev builds.
      +materialized: "{{ 'table' if target.name == 'prod' else 'view' }}"
      # Spark builds tables as Delta
      +file_format: delta

seeds:
  dbt_utils_demo:
    # Pin the types so the columns don't depend on Spark's type inference
    customers:
      +column_types:
        customer_id: bigint
    orders:
      +column_types:
        order_id: bigint
        customer_id: bigint
        amount: decimal(38,2)
