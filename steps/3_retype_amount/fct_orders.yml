# Two incremental models with the same SQL and the same enforced contract.
# They differ only in on_schema_change, and use the only two values dbt
# accepts on an incremental model with an enforced contract.
models:
  - name: fct_orders_append_new_columns
    config: &incremental
      materialized: incremental
      incremental_strategy: merge
      unique_key: order_id
      file_format: delta
      contract: {enforced: true}
      on_schema_change: append_new_columns
    data_tests: &contract_tests
      - matches_contract
    columns: &contract_columns
      - name: order_id
        data_type: bigint
      - name: customer_id
        data_type: bigint
      - name: amount
        data_type: double
      - name: status
        data_type: string

  - name: fct_orders_fail
    config:
      <<: *incremental
      on_schema_change: fail
    data_tests: *contract_tests
    columns: *contract_columns
