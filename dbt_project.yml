name: 'dbt_utils_demo'
version: '1.0.0'
config-version: 2

profile: 'dbt_utils_demo'

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]

clean-targets:
  - "target"
  - "dbt_packages"

flags:
  # dbt-core 1.9 to 1.11: compare the unrendered value of configs set in
  # config() and in properties YAML, so configs that depend on target.name
  # don't look modified in CI. dbt v2 ignores it and always does this.
  # slim_ci_demo.sh sets it to false to show the false positive.
  state_modified_compare_more_unrendered_values: true

models:
  dbt_utils_demo:
    +materialized: view
    marts:
      # Tables in prod, views everywhere else: cheaper CI and dev builds.
      +materialized: "{{ 'table' if target.name == 'prod' else 'view' }}"

seeds:
  dbt_utils_demo:
    # Pin the types so dbt-core and dbt v2 build the same columns
    customers:
      +column_types:
        customer_id: bigint
    orders:
      +column_types:
        order_id: bigint
        customer_id: bigint
        amount: decimal(38,2)
