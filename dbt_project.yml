name: 'dbt_utils_demo'
version: '1.0.0'
config-version: 2

profile: 'dbt_utils_demo'

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  dbt_utils_demo:
    +materialized: view
    marts:
      +materialized: table
      # Spark builds tables as Delta
      +file_format: delta

seeds:
  dbt_utils_demo:
    # Pin the types so the columns don't depend on Spark's type inference
    customers:
      +column_types:
        customer_id: bigint
    orders:
      +column_types:
        order_id: bigint
        customer_id: bigint
        amount: decimal(38,2)
