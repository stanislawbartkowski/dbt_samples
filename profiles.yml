dbt_utils_demo:
  outputs:
    # The production job builds here. Slim CI defers unchanged models to it.
    prod:
      type: spark
      method: spark-connect
      host: "{{ env_var('SPARK_CONNECT_HOST', 'localhost') }}"
      port: 15002
      schema: slim_gha_prod
      threads: 4
    # One schema per pull request: ci/slim_ci.sh sets DBT_CI_SCHEMA=slim_gha_pr_<number>
    ci:
      type: spark
      method: spark-connect
      host: "{{ env_var('SPARK_CONNECT_HOST', 'localhost') }}"
      port: 15002
      schema: "{{ env_var('DBT_CI_SCHEMA', 'slim_gha_ci') }}"
      threads: 4
  target: ci
